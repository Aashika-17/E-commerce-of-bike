<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bike Listing Form</title>
  <link rel="stylesheet" href="Bike-listing.css">
</head>
<body>

  <!-- Main Container -->
  <div class="form-container">
    <h2>Bike Listing</h2>

    <!-- Image Upload Row -->
    <div class="image-row">
      <!-- First Image Upload -->
      <div class="upload-box">
        <p>📷 Click or Drag to upload the image</p>
      </div>
      <!-- Second Image Upload -->
      <div class="upload-box">
        <p>🖼️</p>
      </div>
    </div>

    <!-- Two-column input fields -->
    <form>
      <div class="form-grid">
        <div>
          <label>Title</label>
          <input type="text">
        </div>
        <div>
          <label>Model Year</label>
          <input type="text">
        </div>

        <div>
          <label>Brand</label>
          <input type="text">
        </div>
        <div>
          <label>Type</label>
          <input type="text">
        </div>

        <div>
          <label>Condition</label>
          <input type="text">
        </div>
        <div>
          <label>Kilometers Run</label>
          <input type="text">
        </div>

        <div>
          <label>Fuel Type</label>
          <input type="text">
        </div>
        <div>
          <label>Price</label>
          <input type="text">
        </div>

        <div>
          <label>Mileage</label>
          <input type="text">
        </div>
        <div class="break">
          <label>Availability</label>
          <input type="text">
        </div>
        <div>
          <label>Color</label>
          <input type="text">
        </div>
      </div>

      <!-- Description -->
      <div class="full-width">
        <label>Description</label>
        <textarea></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Public listing</button>
    </form>
  </div>

</body>
</html>

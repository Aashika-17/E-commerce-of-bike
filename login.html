<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login-Page</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Main container for login and image section -->
  <div class="container">
      
    <!-- Login Panel -->
    <div class="login-box">
        <a href="#" class="signup">Sign Up</a>
      <div class="header">
        <h2><strong>Login</strong></h2>
  
      </div>

      <!-- Username input -->
      <div class="input-group">
        <span>👤</span>
        <input type="text" placeholder="User name" />
      </div>

      <!-- Password input -->
      <div class="input-group">
        <span>🔒</span>
        <input type="password" placeholder="Password" />
      </div>

      <!-- Role selection -->
      <div class="role-select">
        <label><input type="radio" name="role" checked /> I am customer</label>
        <label><input type="radio" name="role" /> I am seller</label>
      </div>

      <!-- Login button -->
      <button class="btn">Login now</button>

      <div class="divider">OR</div>

      <!-- Google login button -->
      <button class="btn google">Login with Google</button>
    </div>

    <!-- Right-side image/message section -->
    <div class="image-box">
      <img src="C:\Users\work\Desktop\GIT-DEMO\image\login-page.png" alt="Rider Image" />
    </div>
    
  </div>

</body>
</html>

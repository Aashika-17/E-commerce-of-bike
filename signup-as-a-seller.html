<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link rel="stylesheet" href="signup-as-a-seller.css">
</head>
<body>

  <!-- Form Container -->
  <div class="form-container">
    <!-- Title -->
    <h2>Start Selling Today</h2>
    <p class="subtitle">
      Join thousand of successful sellers and grow your business with<br>
      our powerful marketplace platform
    </p>

    <!-- Seller Registration Form -->
    <form>

      <!-- Name fields -->
      <div class="row">
        <div class="input-group">
          <label>First Name *</label>
          <input type="text" placeholder="Jhon" required="">
        </div>
        <div class="input-group">
          <label>Last Name *</label>
          <input type="text" placeholder="Roy" required="">
        </div>
      </div>

      <!-- Email -->
      <div class="input-group">
        <label>Enter your Email *</label>
        <input type="email" placeholder="Jhon12@gmail.com" required="">
      </div>

      <!-- Password -->
      <div class="input-group">
        <label>Password *</label>
        <input type="password" placeholder="Create a strong password" required="">
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label>Password *</label>
        <input type="password" placeholder="Confirm your password" required="">
      </div>

      <!-- Business Name -->
      <div class="input-group">
        <label>Business/Store Name *</label>
        <input type="text" placeholder="Business name" required="">
      </div>

      <!-- Website / Social Media -->
      <div class="input-group">
        <label>Website / Social Media (Optional)</label>
        <input type="text" placeholder="Business name">
      </div>

      <!-- Terms Checkbox -->
      <div class="checkbox-group">
        <input type="checkbox" id="terms" required="">
        <label for="terms">
          I agree to the Terms of Service and Privacy Policy
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn">Create Seller Account</button>

    </form>
  </div>


</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="Contact-us.css">
</head>
<body>
  <!-- Main container -->
  <div class="container">
 <h1 class="title">Contact Us</h1>
    <!-- Left Section -->
    <div class="left">
     
      <h2>Let’s Chat</h2>

      <!-- Info lines -->
      <p class="info">Need to get in touch with us??</p>
      <p class="info">Fill out the form with your inquiry</p>

      <!-- Contact icon -->
      <div class="contact-bubble">contact us</div>
    </div>

    <!-- Right Section: Form -->
    <div class="right">
      <form>
        <input type="text" placeholder="Enter Name" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Message" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>

  </div>
</body>
</html>
